[project]
name = "qushiuyin-api"
version = "0.1.0"
description = "FastAPI service for authorized short video watermark processing."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "imageio-ffmpeg>=0.5.1",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  "python-multipart>=0.0.20",
  "uvicorn[standard]>=0.32.0"
]

[tool.ruff]
line-length = 100
target-version = "py311"
